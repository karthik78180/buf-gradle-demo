syntax = "proto3";

package google.api.v1;

import "google/protobuf/descriptor.proto";

option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";
option java_multiple_files = true;
option java_outer_classname = "ResourceProto";
option java_package = "com.google.api";
option objc_class_prefix = "GAPI";

extend google.protobuf.FileOptions {
  repeated google.api.v1.ResourceDescriptor resource_definition = 1053;
}

extend google.protobuf.MessageOptions {
  google.api.v1.ResourceDescriptor resource = 1053;
}

extend google.protobuf.FieldOptions {
  google.api.v1.ResourceReference resource_reference = 1055;
}

message ResourceDescriptor {
  enum History {
    HISTORY_UNSPECIFIED = 0;
    HISTORY_ORIGINALLY_SINGLE_PATTERN = 1;
    HISTORY_FUTURE_MULTI_PATTERN = 2;
  }

  string type = 1;
  repeated string pattern = 2;
  string name_field = 3;
  History history = 4;
  string plural = 5;
  string singular = 6;
  repeated string style = 10;
}

message ResourceReference {
  string type = 1;
  bool child_type = 2;
}
