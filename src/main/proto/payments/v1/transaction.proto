syntax = "proto3";

package payments.v1;

option java_multiple_files = true;
option java_outer_classname = "PaymentsProto";
option java_package = "com.example.payments.v1";

// Transaction represents a lightweight payment transaction
message Transaction {
  string id = 1;
  string store_name = 2;
  double amount = 3;
  string currency = 4;
  string location_zip = 5;
}

// GetTransactionRequest takes store_name as input
message GetTransactionRequest {
  string store_name = 1;
}

// GetTransactionResponse returns Transaction with given store_name
message GetTransactionResponse {
  Transaction transaction = 1;
}
