syntax = "proto3";

package payments.v1;

import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "payments/v1/payment_common.proto";

option java_multiple_files = true;
option java_outer_classname = "PaymentsProto";
option java_package = "com.example.payments.v1";

// Transaction represents a payment transaction
message Transaction {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  double amount = 2 [(google.api.field_behavior) = REQUIRED];
  string currency = 3 [(google.api.field_behavior) = REQUIRED];
  CardHolder cardholder = 4 [(google.api.field_behavior) = REQUIRED];
  Store store = 5 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CreateTransactionRequest
message CreateTransactionRequest {
  string parent = 1;
  Transaction transaction = 2 [(google.api.field_behavior) = REQUIRED];
}

// CreateTransactionResponse
message CreateTransactionResponse {
  Transaction transaction = 1;
}

// GetTransactionRequest
message GetTransactionRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// GetTransactionResponse
message GetTransactionResponse {
  Transaction transaction = 1;
}

// ListTransactionsRequest
message ListTransactionsRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}

// ListTransactionsResponse
message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
}

// DeleteTransactionRequest
message DeleteTransactionRequest {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

// DeleteTransactionResponse
message DeleteTransactionResponse {}
