syntax = "proto3";

package payments.v1;

option java_multiple_files = true;
option java_outer_classname = "PaymentSchemas";
option java_package = "com.example.payments.v1";

message CardHolderDetails {
  string cardholder_name = 1;
  string email = 2;
}

message AddressDetails {
  string line1 = 1;
  string line2 = 2;
  string city = 3;
  string state = 4;
  string zipcode = 5;
  string country = 6;
}

message StoreDetails {
  string store_id = 1;
  string store_name = 2;
}

message MerchandiseDetails {
  string sku = 1;
  string description = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message ProductDetails {
  repeated MerchandiseDetails items = 1;
}

message TransactionDetails {
  string txn_id = 1;
  double amount = 2;
  string currency = 3;
  StoreDetails store = 4;
  ProductDetails products = 5;
}

message CustomerTransactionSummary {
  CardHolderDetails cardholder = 1;
  AddressDetails address = 2;
  repeated TransactionDetails txns = 3;
}
