syntax = "proto3";
package payments.v1;

import "google/api/v1/field_behavior.proto";
import "google/api/v1/http.proto";
import "google/api/v1/resource.proto";
import "google/protobuf/timestamp.proto";
import "schema/meta/v1/meta.proto";

option java_multiple_files = true;
option java_outer_classname = "PaymentsProto";
option java_package = "com.example.payments.v1";
// simple file-level meta (migrated to company schema meta)
option (schema.meta.v1.file_meta) = {
  tags: {
    key: "x-meta-domain"
    value: "payments"
  }
  tags: {
    key: "x-meta-owner"
    value: "team-payments"
  }
};

message Address {
  string line1 = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string line2 = 2;
  string city = 3 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string state = 4;
  string zipcode = 5 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string country = 6 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
}

message CardHolder {
  string cardholder_name = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string email = 2;
  Address billing_address = 3;
}

message Store {
  string store_id = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string store_name = 2;
  Address address = 3;
}

message MerchandiseItem {
  option (schema.meta.v1.message_meta) = {
    tags: {
      key: "x-meta-entity"
      value: "line-item"
    }
  };
  string sku = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string description = 2;
  int32 quantity = 3 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  double unit_price = 4 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
}

message ProductDetails {
  repeated MerchandiseItem items = 1;
}

message Transaction {
  option (google.api.v1.resource) = {
    type: "payments.googleapis.com/Transaction"
    pattern: "transactions/{transaction}"
  };

  string name = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_OUTPUT_ONLY];
  string client_token = 2;
  double amount = 3 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string currency = 4 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  CardHolder cardholder = 5 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  Store store = 6 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  ProductDetails products = 7;
  google.protobuf.Timestamp create_time = 8 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_OUTPUT_ONLY];
}

// minimal requests/responses + HTTP routes
message CreateTransactionRequest {
  string parent = 1;
  Transaction transaction = 2 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
}
message CreateTransactionResponse {
  Transaction transaction = 1;
}
message GetTransactionRequest {
  string name = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
}
message GetTransactionResponse {
  Transaction transaction = 1;
}
message ListTransactionsRequest {
  string parent = 1;
  int32 page_size = 2;
  string page_token = 3;
}
message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  string next_page_token = 2;
}
message UpdateTransactionRequest {
  string name = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
  string client_token = 2;
  ProductDetails products = 3;
}
message UpdateTransactionResponse {
  Transaction transaction = 1;
}
message DeleteTransactionRequest {
  string name = 1 [(google.api.v1.field_behavior) = FIELD_BEHAVIOR_REQUIRED];
}
message DeleteTransactionResponse {}

service PaymentsService {
  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionResponse) {
    option (google.api.v1.http) = {
      post: "/v1/transactions"
      body: "transaction"
    };
  }
  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionResponse) {
    option (google.api.v1.http) = {get: "/v1/{name=transactions/*}"};
  }
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse) {
    option (google.api.v1.http) = {get: "/v1/transactions"};
  }
  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionResponse) {
    option (google.api.v1.http) = {
      patch: "/v1/{name=transactions/*}"
      body: "*"
    };
  }
  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionResponse) {
    option (google.api.v1.http) = {delete: "/v1/{name=transactions/*}"};
  }
}
