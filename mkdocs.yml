site_name: Payment Transaction API Documentation
site_description: Protocol Buffer API documentation for payment transaction processing
site_author: Your Organization
site_url: https://karthik78180.github.io/buf-gradle-demo/
repo_url: https://github.com/karthik78180/buf-gradle-demo
repo_name: buf-gradle-demo
docs_dir: docs
site_dir: site

# Theme configuration
theme:
  name: material
  logo: https://raw.githubusercontent.com/bufbuild/buf/main/docs/static/img/logo.png
  favicon: https://raw.githubusercontent.com/bufbuild/buf/main/docs/static/img/favicon.ico

  features:
    - content.code.copy
    - content.code.select
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.share
    - toc.follow

  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Markdown extensions
markdown_extensions:
  - pymdownx.highlight:
      use_pygments: true
      linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - tables

# Navigation structure
nav:
  - Home: index.md
  - API Reference:
    - Overview: api/overview.md
    - Proto Files: proto/index.md

# Search configuration
plugins:
  - search:
      lang: en
  - social:
      cards_layout_options:
        background_color: "#1f5e78"

# Footer
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/karthik78180/buf-gradle-demo
      name: GitHub Repository
  generator: false

# Copyright footer
copyright: |
  &copy; 2025 All rights reserved.
  Documentation generated from <a href="https://github.com/karthik78180/buf-gradle-demo" target="_blank">Protocol Buffers</a>
  using <a href="https://github.com/pseudomuto/protoc-gen-doc" target="_blank">protoc-gen-doc</a>
  and <a href="https://www.mkdocs.org/" target="_blank">MkDocs</a>.
