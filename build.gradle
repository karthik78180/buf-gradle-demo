plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.5'
    id 'build.buf' version '0.10.3'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.protobuf:protobuf-java:4.32.1'
    implementation 'com.google.api.grpc:proto-google-common-protos:2.61.2'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.guava:guava:33.3.1-jre'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'com.example.app.App'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.32.1'
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
        java {
            srcDirs 'build/generated/source/proto/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

// Handle duplicate proto resources from extracted dependencies
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateProto')
}

tasks.test {
    useJUnitPlatform()
}

configurations.all {
    resolutionStrategy.force 'com.google.protobuf:protobuf-java:4.32.1'
}

// Buf linting configuration - for proto validation and linting only
buf {
    enforceFormat = true
    toolVersion = '1.53.0'
    configFileLocation = file('buf.yaml')
}

// Disable Buf code generation - using protobuf-gradle-plugin instead
tasks.named('bufGenerate').configure {
    enabled = false
}

// Run Buf linting before proto code generation
tasks.named('generateProto') {
    dependsOn tasks.named('bufLint')
}

// Documentation generation task using protoc-gen-doc
tasks.register('generateProtoDocs', Exec) {
    description = 'Generate Protocol Buffer documentation using protoc-gen-doc'
    group = 'documentation'

    // Use Docker image to avoid local installation
    commandLine 'docker', 'run', '--rm',
        '-v', "${projectDir}/src/main/proto:/protos",
        '-v', "${projectDir}/docs/proto:/out",
        'pseudomuto/protoc-gen-doc:latest',
        '--doc_opt=markdown,index.md'

    // Ensure output directory exists
    doFirst {
        file("${projectDir}/docs/proto").mkdirs()
    }

    // Only run if Docker is available
    onlyIf {
        try {
            'docker --version'.execute().waitFor() == 0
        } catch (Exception e) {
            false
        }
    }
}

// Alternative task using native protoc-gen-doc if Docker is not available
tasks.register('generateProtoDocsNative', Exec) {
    description = 'Generate Protocol Buffer documentation using native protoc-gen-doc'
    group = 'documentation'
    enabled = false  // Disabled by default, enable if protoc-gen-doc is installed

    commandLine 'protoc',
        '--doc_out=./docs/proto',
        '--doc_opt=markdown,index.md',
        '-I', 'src/main/proto',
        'src/main/proto/payments/v1/transaction.proto',
        'src/main/proto/schema/meta/v1/meta.proto'

    doFirst {
        file("${projectDir}/docs/proto").mkdirs()
    }
}

