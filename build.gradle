plugins {
    id 'java'
    id 'application'
    id 'com.google.protobuf' version '0.9.5'
    id 'build.buf' version '0.10.3'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.protobuf:protobuf-java:4.32.1'
    implementation 'com.google.api.grpc:proto-google-common-protos:2.61.2'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.guava:guava:33.3.1-jre'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'com.example.app.App'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.32.1'
    }

    // Documentation generation plugin
    plugins {
        doc {
            artifact = 'io.github.pseudomuto:protoc-gen-doc:1.5.1'
        }
    }

    // Generate documentation as HTML with services displayed first using custom template
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                doc {
                    option "${rootDir}/.github/proto-doc.tmpl,index.html"
                }
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
        java {
            srcDirs 'build/generated/source/proto/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

// Handle duplicate proto resources from extracted dependencies
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateProto')
}

tasks.test {
    useJUnitPlatform()
}

configurations.all {
    resolutionStrategy.force 'com.google.protobuf:protobuf-java:4.32.1'
}

// Buf linting configuration - for proto validation and linting only
buf {
    enforceFormat = true
    toolVersion = '1.53.0'
    configFileLocation = file('buf.yaml')
}

// Disable Buf code generation - using protobuf-gradle-plugin instead
tasks.named('bufGenerate').configure {
    enabled = false
}

// Generate proto-doc.tmpl from base template + project-config.yaml
task generateProtoDocTemplate {
    def root = rootDir
    inputs.file("${root}/.github/project-config.yaml")
    inputs.file("${root}/.github/proto-doc-base.tmpl")
    outputs.file("${root}/.github/proto-doc.tmpl")

    doLast {
        // Read project configuration from YAML
        File configFile = new File("${root}/.github/project-config.yaml")
        Map<String, String> config = [:]

        configFile.eachLine { line ->
            if (line.contains(':') && !line.startsWith('#')) {
                def parts = line.split(':', 2)
                if (parts.size() == 2) {
                    def key = parts[0].trim()
                    def value = parts[1].trim()
                    config[key] = value
                }
            }
        }

        // Read base template
        File baseTemplate = new File("${root}/.github/proto-doc-base.tmpl")
        String template = baseTemplate.text

        // Replace placeholders with config values
        template = template.replace('{{PROJECT_TITLE}}', config.get('projectTitle', 'API Service Suite'))
        template = template.replace('{{PROJECT_ID}}', config.get('projectId', 'project-id'))
        template = template.replace('{{AUTHENTICATION_TYPE}}', config.get('authenticationType', 'JWT'))
        template = template.replace('{{DOCUMENTATION_URL}}', config.get('documentationUrl', 'https://example.com'))

        // Write generated template
        File outputTemplate = new File("${root}/.github/proto-doc.tmpl")
        outputTemplate.text = template
    }
}

// Task: bufValidate - comprehensive proto validation
task bufValidate {
    dependsOn tasks.named('bufLint')
    dependsOn tasks.named('bufFormatCheck')
}

// Run Buf validation before proto code generation
tasks.named('generateProto') {
    dependsOn tasks.named('generateProtoDocTemplate')
    dependsOn tasks.named('bufValidate')
}

// Add bufValidate to the default build
tasks.named('build') {
    dependsOn tasks.named('bufValidate')
}


