plugins {
    id 'java'
    id 'application'
    id 'build.buf' version '0.10.3'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.protobuf:protobuf-java:4.32.1'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.guava:guava:33.3.1-jre'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'com.example.app.App'
}

tasks.test { useJUnitPlatform() }

configurations.all {
    resolutionStrategy.force 'com.google.protobuf:protobuf-java:4.32.1'
}

def BUF_GEN_DIR = "bufbuild/generated"

buf {
    enforceFormat = true
    toolVersion = '1.53.0'
    configFileLocation = file('buf.yaml')
    generate {
        templateFileLocation = file('buf.gen.yaml')
        includeImports = true
    }
}

tasks.named('compileJava') { dependsOn('bufGenerate') }

sourceSets {
    main {
        java.srcDir(layout.buildDirectory.dir("${BUF_GEN_DIR}/java"))
        resources.srcDir 'src/main/resources'
    }
}

