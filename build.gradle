plugins {
    id 'com.kxk.java-gradle-plugin' version 'unspecified'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'com.google.protobuf:protobuf-java:4.32.1'
    implementation 'com.google.api.grpc:proto-google-common-protos:2.61.2'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.google.guava:guava:33.3.1-jre'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

application {
    mainClass = 'com.example.app.App'
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.32.1'
    }

    // Documentation generation plugin (custom configuration)
    plugins {
        doc {
            artifact = 'io.github.pseudomuto:protoc-gen-doc:1.5.1'
        }
    }

    // Generate documentation as HTML using protoc-gen-doc default template
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                doc {
                }
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
        java {
            srcDirs 'build/generated/source/proto/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

// Handle duplicate proto resources from extracted dependencies
tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.WARN
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateProto')
}

tasks.test {
    useJUnitPlatform()
}

configurations.all {
    resolutionStrategy.force 'com.google.protobuf:protobuf-java:4.32.1'
}

// Buf configuration (optional - override plugin defaults if needed)
// buf {
//     enforceFormat = true
//     toolVersion = '1.53.0'
//     configFileLocation = file('buf.yaml')
// }

// NOTE: The following are now handled by the kxk.java-gradle-plugin:
// - bufGenerate is disabled by default
// - bufValidate task is created and configured
// - Task dependencies are set up: bufValidate -> generateProto -> compileJava
// - bufValidate is included in the build task


